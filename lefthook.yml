pre-commit:
  parallel: true
  commands:
    lint:
      # --no-error-on-unmatched-pattern: when all staged files live under
      # `desktop/` (excluded by .oxlintrc.json's ignorePatterns), oxlint
      # would otherwise exit 1 on an empty filtered set and block the commit.
      run: bunx oxlint --type-aware --fix --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
      glob: '*.{ts,tsx}'
    format-check:
      # Same rationale: .prettierignore excludes `desktop/`, so a desktop-only
      # commit would feed oxfmt 0 targets and fail. The flag makes that a no-op.
      run: bunx oxfmt --write --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
      glob: '*.{ts,tsx,json}'
    knip:
      run: bun run knip
      glob: '*.{ts,tsx}'

pre-push:
  parallel: true
  commands:
    lint:
      run: bun run lint
    format:
      run: bun run format
    typecheck:
      run: bun run check
    test:
      run: bun test
