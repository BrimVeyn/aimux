pre-commit:
  parallel: true
  commands:
    lint:
      run: bunx oxlint --type-aware --fix {staged_files} && git add {staged_files}
      glob: '*.{ts,tsx}'
    format-check:
      run: bunx oxfmt --write {staged_files} && git add {staged_files}
      glob: '*.{ts,tsx,json}'
    knip:
      run: bun run knip
      glob: '*.{ts,tsx}'

pre-push:
  parallel: true
  commands:
    lint:
      run: bun run lint
    format:
      run: bun run format
    typecheck:
      run: bun run check
    test:
      # Git exports GIT_DIR/GIT_INDEX_FILE to its hooks, and every `git` the
      # tests run in their temp repos inherits them — commits then land in THIS
      # repository instead. Scrub them before handing control to the suite.
      run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX -u GIT_COMMON_DIR bun test
