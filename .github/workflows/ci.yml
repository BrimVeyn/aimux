name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run check

      - name: Protocol discipline check
        # Needs access to origin/main so the MIN-bump comparison can run.
        # `actions/checkout@v4` only fetches the merge commit by default; fetch
        # the main ref explicitly so the script can diff against it.
        run: |
          git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main || true
          bun run lint:protocol
