name: Release

on:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @brimveyn/aimux-config
        working-directory: packages/aimux-config
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$(npm view @brimveyn/aimux-config@$VERSION version 2>/dev/null)" ]; then
            npm publish --provenance --access public --ignore-scripts
          else
            echo "@brimveyn/aimux-config@$VERSION already published, skipping"
          fi

      - name: Publish @brimveyn/aimux
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$(npm view @brimveyn/aimux@$VERSION version 2>/dev/null)" ]; then
            npm publish --provenance --access public --ignore-scripts
          else
            echo "@brimveyn/aimux@$VERSION already published, skipping"
          fi
