name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch runs from a branch, where there is no tag to attach a
      # GitHub release to. Dispatch is the manual recovery path for a tag push
      # that Actions never picked up: republish npm, skip the release page.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Publish @brimveyn/aimux-config
        working-directory: packages/aimux-config
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$(npm view @brimveyn/aimux-config@$VERSION version 2>/dev/null)" ]; then
            bun publish --access public
          else
            echo "@brimveyn/aimux-config@$VERSION already published, skipping"
          fi

      - name: Verify aimux-config workspace dep resolves correctly
        run: |
          EXPECTED=$(node -p "require('./packages/aimux-config/package.json').version")
          mkdir -p /tmp/aimux-verify
          bun pm pack --destination /tmp/aimux-verify
          cd /tmp/aimux-verify
          tar xzf *.tgz
          ACTUAL=$(node -p "require('./package/package.json').dependencies['@brimveyn/aimux-config']")
          echo "expected aimux-config dep = $EXPECTED"
          echo "actual   aimux-config dep = $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: bun resolved workspace:* to $ACTUAL, but packages/aimux-config is at $EXPECTED. Refusing to publish a stale dependency. Regenerate bun.lock or pin the dep explicitly." >&2
            exit 1
          fi

      - name: Publish @brimveyn/aimux
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$(npm view @brimveyn/aimux@$VERSION version 2>/dev/null)" ]; then
            bun publish --access public
          else
            echo "@brimveyn/aimux@$VERSION already published, skipping"
          fi
